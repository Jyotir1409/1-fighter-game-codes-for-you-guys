<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1 fighter unilotech</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05060a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #wrap {
    position: relative;
  }
  canvas {
    background: radial-gradient(ellipse at center, #0b1020 0%, #05060a 100%);
    display: block;
    border: 2px solid #2a3a5a;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(80, 140, 255, 0.15);
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    color: #cfe0ff;
    font-size: 18px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(80,140,255,0.6);
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(3, 5, 12, 0.85);
    color: #eaf1ff;
    text-align: center;
    gap: 14px;
  }
  #overlay h1 {
    font-size: 34px;
    color: #7fd0ff;
    text-shadow: 0 0 14px rgba(80,180,255,0.7);
    letter-spacing: 2px;
  }
  #overlay p {
    font-size: 14px;
    color: #9fb3d9;
    max-width: 340px;
    line-height: 1.5;
  }
  #startBtn {
    margin-top: 8px;
    padding: 12px 28px;
    background: linear-gradient(180deg, #3d7bff, #1a4fd6);
    border: none;
    border-radius: 6px;
    color: white;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(50,100,255,0.4);
  }
  #startBtn:hover { filter: brightness(1.15); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">3</span></div>
  </div>
  <div id="overlay">
    <h1 id="title">STAR DEFENDER</h1>
    <p id="message">Arrow keys / A-D to move, Space to fire.<br>On mobile: drag to move, tap to shoot.<br>Survive the waves and rack up points.</p>
    <button id="startBtn">START</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const title = document.getElementById('title');
const message = document.getElementById('message');
const startBtn = document.getElementById('startBtn');

let keys = {};
let bullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let stars = [];
let score = 0;
let lives = 3;
let running = false;
let frame = 0;
let spawnTimer = 0;
let difficultyTimer = 0;
let spawnInterval = 70;

const player = {
  x: W / 2 - 18,
  y: H - 70,
  w: 36,
  h: 36,
  speed: 5,
  cooldown: 0,
  alive: true
};

// Starfield background
for (let i = 0; i < 80; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.6 + 0.4,
    s: Math.random() * 1.5 + 0.4
  });
}

function resetGame() {
  bullets = [];
  enemyBullets = [];
  enemies = [];
  particles = [];
  score = 0;
  lives = 3;
  frame = 0;
  spawnTimer = 0;
  difficultyTimer = 0;
  spawnInterval = 70;
  player.x = W / 2 - 18;
  player.y = H - 70;
  player.cooldown = 0;
  player.alive = true;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
}

function spawnEnemy() {
  const type = Math.random();
  let enemy;
  if (type < 0.15) {
    // tougher shooter enemy
    enemy = { x: Math.random() * (W - 40) + 10, y: -30, w: 34, h: 28, speed: 1.4, hp: 2, shootTimer: Math.random() * 100 + 60, kind: 'shooter', color: '#ff6b9d' };
  } else {
    enemy = { x: Math.random() * (W - 34) + 10, y: -30, w: 28, h: 24, speed: 1.8 + Math.random() * 1.4, hp: 1, kind: 'grunt', color: '#5bd8ff' };
  }
  enemies.push(enemy);
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function spawnExplosion(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 10,
      color
    });
  }
}

function update() {
  frame++;

  // starfield
  for (const s of stars) {
    s.y += s.s;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }

  if (!running) return;

  // player movement
  if (player.alive) {
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
    player.x = Math.max(4, Math.min(W - player.w - 4, player.x));
    player.y = Math.max(H * 0.4, Math.min(H - player.h - 8, player.y));

    if (player.cooldown > 0) player.cooldown--;
    if ((keys[' '] || keys['Spacebar']) && player.cooldown <= 0) {
      bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 6, w: 4, h: 12, speed: 9 });
      player.cooldown = 9;
    }
  }

  // bullets
  bullets.forEach(b => b.y -= b.speed);
  bullets = bullets.filter(b => b.y + b.h > 0);

  enemyBullets.forEach(b => b.y += b.speed);
  enemyBullets = enemyBullets.filter(b => b.y < H);

  // spawn logic
  difficultyTimer++;
  if (difficultyTimer % 300 === 0 && spawnInterval > 24) spawnInterval -= 4;
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnEnemy();
  }

  // enemies
  enemies.forEach(e => {
    e.y += e.speed;
    if (e.kind === 'shooter') {
      e.shootTimer--;
      if (e.shootTimer <= 0 && e.y > 0 && e.y < H - 100) {
        enemyBullets.push({ x: e.x + e.w / 2 - 2, y: e.y + e.h, w: 4, h: 10, speed: 5 });
        e.shootTimer = 90 + Math.random() * 60;
      }
    }
  });

  // enemy off-screen (missed) -> no penalty, just remove
  enemies = enemies.filter(e => {
    if (e.y > H + 40) return false;
    return true;
  });

  // bullet-enemy collisions
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (rectsOverlap(e, b)) {
        bullets.splice(j, 1);
        e.hp--;
        if (e.hp <= 0) {
          spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, e.color);
          score += e.kind === 'shooter' ? 25 : 10;
          scoreEl.textContent = score;
          enemies.splice(i, 1);
        }
        break;
      }
    }
  }

  // player collisions
  if (player.alive) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (rectsOverlap(e, player)) {
        spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, e.color);
        enemies.splice(i, 1);
        hitPlayer();
      }
    }
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      if (rectsOverlap(b, player)) {
        enemyBullets.splice(i, 1);
        hitPlayer();
      }
    }
  }

  // particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
}

function hitPlayer() {
  lives--;
  livesEl.textContent = lives;
  spawnExplosion(player.x + player.w / 2, player.y + player.h / 2, '#7fd0ff');
  if (lives <= 0) {
    endGame();
  } else {
    // brief invulnerability by nudging player, no fancy timer needed for simplicity
  }
}

function endGame() {
  running = false;
  player.alive = false;
  title.textContent = 'GAME OVER';
  message.innerHTML = `Final score: <b style="color:#7fd0ff">${score}</b><br>Press start to try again.`;
  startBtn.textContent = 'RESTART';
  overlay.classList.remove('hidden');
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // stars
  ctx.fillStyle = '#ffffff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.5 + Math.random() * 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  if (player.alive) {
    drawShip(player.x, player.y, player.w, player.h);
  }

  // player bullets
  ctx.fillStyle = '#ffe066';
  bullets.forEach(b => {
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });
  ctx.shadowBlur = 0;

  // enemy bullets
  ctx.fillStyle = '#ff5b5b';
  enemyBullets.forEach(b => {
    ctx.shadowColor = '#ff5b5b';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });
  ctx.shadowBlur = 0;

  // enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(e.x + e.w / 2, e.y + e.h);
    ctx.lineTo(e.x, e.y);
    ctx.lineTo(e.x + e.w, e.y);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(p.life / 40, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  });
  ctx.globalAlpha = 1;
}

function drawShip(x, y, w, h) {
  ctx.fillStyle = '#7fd0ff';
  ctx.shadowColor = '#3d9fff';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x + w / 2, y + h * 0.72);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // engine flicker
  if (frame % 6 < 3) {
    ctx.fillStyle = '#ffb347';
    ctx.beginPath();
    ctx.moveTo(x + w / 2 - 5, y + h - 2);
    ctx.lineTo(x + w / 2 + 5, y + h - 2);
    ctx.lineTo(x + w / 2, y + h + 10);
    ctx.closePath();
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Input handling
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch/mouse controls: drag to move, tap to fire
let dragging = false;
function pointerToCanvas(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height)
  };
}
canvas.addEventListener('touchstart', e => {
  dragging = true;
  keys[' '] = true;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (!dragging) return;
  const t = e.touches[0];
  const pos = pointerToCanvas(t.clientX, t.clientY);
  player.x = pos.x - player.w / 2;
  player.y = pos.y - player.h / 2;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  dragging = false;
  keys[' '] = false;
  e.preventDefault();
}, { passive: false });

startBtn.addEventListener('click', () => {
  resetGame();
  running = true;
  overlay.classList.add('hidden');
});

loop();
</script>
</body>
</html>
